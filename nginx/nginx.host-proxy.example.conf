# Example: add to the EXISTING host nginx (do not replace the other app's server block).
# SkillVault Docker stack listens on 127.0.0.1:8080 (docker-compose.server.yml).
#
# Option A - subdomain (recommended if DNS is available):
#
# server {
#     listen 80;
#     server_name skillvault.yourcompany.local;
#
#     location / {
#         proxy_pass http://127.0.0.1:8080;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }
#
# Option B - path prefix (requires SkillVault nginx to know the prefix; default image uses /).
# Prefer Option A or direct http://172.16.200.30:8080 unless you customize frontend base.
#
# After editing host nginx:
#   sudo nginx -t && sudo systemctl reload nginx

upstream skillvault_app {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name skillvault.yourcompany.local;

    client_max_body_size 20m;

    location / {
        proxy_pass http://skillvault_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
